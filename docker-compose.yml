version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "9898:9898"
    volumes:
      - db_data:/calendar-digest/database:rw
    environment:
      - APP_ENV=production
      - SERVER_PORT=9898
      - DATABASE_URL=/calendar-digest/database/data.db
      - LITESTREAM_LOCAL_DB_PATH=/calendar-digest/database/data.db
      - DB_SYNC_INTERVAL=10s
      - S3_DB_URL=${S3_DB_URL:?S3_DB_URL is required}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      - BASE_URL=https://calendar.int.lookout.wiki
      - GOOGLE_SERVICE_ACCOUNT_JSON=${GOOGLE_SERVICE_ACCOUNT_JSON:?GOOGLE_SERVICE_ACCOUNT_JSON is required}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      - ALERT_TELEGRAM_CHAT_ID=${ALERT_TELEGRAM_CHAT_ID:?ALERT_TELEGRAM_CHAT_ID is required}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:?EMAIL_FROM is required}
      - RIVER_UI_EMBEDDED=false
      - TICK_INTERVAL=5m
    healthcheck:
      test: ["CMD", "/usr/bin/app", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:
    driver: local
